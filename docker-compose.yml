version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"  # For local testing, accessible at http://localhost:5173
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - backend_db:/app/db           # Persist local SQLite database
      - backend_session:/app/session # Persist Telegram sessions
    restart: unless-stopped
    networks:
      - app-network

volumes:
  backend_db:
  backend_session:

networks:
  app-network:
    driver: bridge
