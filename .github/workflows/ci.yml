name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: telegram-drive-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Build Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: telegram-drive-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Coolify Deployment
        run: |
          if [ -z "${{ secrets.COOLIFY_WEBHOOK }}" ]; then
            echo "COOLIFY_WEBHOOK secret is not set. Skipping deployment."
          else
            echo "Triggering deployment in Coolify..."
            curl -X POST "${{ secrets.COOLIFY_WEBHOOK }}"
          fi
